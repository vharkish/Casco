<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Details | Casco Trade Solutions</title>
    <style>
        :root { --navy: #1a2a44; --gold: #d4af37; }
        body { font-family: sans-serif; margin: 0; text-align: center; }
        header { background: var(--navy); padding: 15px; border-bottom: 3px solid var(--gold); }
        .container { padding: 50px 10%; }
        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .img-box img { width: 100%; border: 4px solid #eee; border-radius: 5px; }
        .label { font-weight: bold; color: var(--gold); display: block; margin-top: 10px; }
        .back-btn { margin-top: 40px; display: inline-block; color: var(--navy); font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <header><a href="projects.html" style="color:white; text-decoration:none; font-weight:bold;">← Back to All Projects</a></header>
    <div class="container">
        <h1>Remodel Townhouse in Tampa</h1> <!-- Change this title for each of the 5 pages -->
        <p>Expertly handled painting, drywall, and luxury vinyl plank (LVP) flooring for a multi-unit townhouse development.</p>
        
        <div class="gallery">
            <div class="img-box">
                <img src="project1-before.jpg" alt="Before"> <!-- Upload your photos to GitHub with these names -->
                <span class="label">BEFORE / ANTES</span>
            </div>
            <div class="img-box">
                <img src="project1-after.jpg" alt="After">
                <span class="label">AFTER / DESPUÉS</span>
            </div>
        </div>
        
        <a href="projects.html" class="back-btn">View More Projects</a>
    </div>
</body>
</html>
