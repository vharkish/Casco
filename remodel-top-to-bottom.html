<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project Details | Casco Trade Solutions LLC</title>
  <link rel="icon" type="image/jpeg" href="logo-1.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #06111F; --navy-mid: #0A1929; --gold: #D4A84B; --gold-light: #ECC96A; --white: #FFFFFF;
      --white-70: rgba(255,255,255,0.70); --white-20: rgba(255,255,255,0.20);
    }
    body { background: var(--navy); color: var(--white); font-family: 'DM Sans', sans-serif; line-height: 1.7; }

    /* EXACT HOMEPAGE HEADER */
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 200; background: rgba(6,17,31,0.97); backdrop-filter: blur(18px); }
    .header-top-trim { height: 3px; background: linear-gradient(90deg, var(--gold), var(--white) 35%, var(--gold) 65%, var(--white)); }
    .header-info { background: rgba(10,25,41,0.95); border-bottom: 1px solid var(--white-20); padding: 0.6rem 2.5rem; text-align: center; }
    .hi-phone { font-size: 1.25rem; font-weight: 800; color: var(--gold-light); text-decoration: none; }
    .hi-label { font-size: 0.75rem; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-right: 8px; }
    nav { max-width: 1280px; margin: 0 auto; padding: 0 2.5rem; height: 68px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo-img { height: 58px; }
    nav ul { display: flex; list-style: none; gap: 1.8rem; }
    nav ul a { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; color: white; text-decoration: none; }
    .header-spacer { height: 121px; }

    .container { max-width: 1000px; margin: 5rem auto; padding: 0 5%; text-align: center; }
    h1 { font-family: 'Playfair Display', serif; font-size: 3rem; color: var(--gold-light); margin-bottom: 20px; }
    .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 40px; }
    .gallery img { width: 100%; border: 3px solid var(--white-20); border-radius: 8px; }
    .label { display: block; margin-top: 15px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }

    footer { background: #030C17; padding: 3rem 2.5rem; border-top: 3px solid var(--gold); text-align: center; }
    @media (max-width: 768px) { .gallery { grid-template-columns: 1fr; } .nav-links { display: none; } }
  </style>
</head>
<body>

<header>
  <div class="header-top-trim"></div>
  <div class="header-info">
    <div><span class="hi-label">Call:</span> <a href="tel:8133777092" class="hi-phone">813-377-7092</a></div>
  </div>
  <nav>
    <a href="index.html"><img class="nav-logo-img" src="logo-1.jpg" alt="Logo" /></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="projects.html">Projects</a></li>
    </ul>
  </nav>
</header>

<div class="header-spacer"></div>

<div class="container">
  <!-- CHANGE THIS TITLE FOR EACH PAGE -->
  <h1>Project Showcase</h1>
  <p style="color:var(--white-70);">Expert transformation by David Casco and his professional crew in Tampa, Florida.</p>
  
  <div class="gallery">
    <div>
      <img src="https://via.placeholder.com/600x450?text=Before+Photo" alt="Before">
      <span class="label">Before / Antes</span>
    </div>
    <div>
      <img src="https://via.placeholder.com/600x450?text=After+Photo" alt="After">
      <span class="label">After / Después</span>
    </div>
  </div>
</div>

<footer>
  <img src="logo-1.jpg" alt="Logo" style="height:44px; margin-bottom:20px;">
  <p>© 2025 Casco Trade Solutions LLC<br>Call Us: 813-377-7092</p>
</footer>

</body>
</html>
